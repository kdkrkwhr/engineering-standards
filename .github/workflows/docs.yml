name: Documentation and hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/smoke_adoption.py
      - run: python3 scripts/test_hygiene.py
      - run: python3 scripts/check_hygiene.py --tracked
      - run: python3 scripts/check_glossary.py
      - run: python3 scripts/test_wiki.py
      - run: node scripts/test_search.js

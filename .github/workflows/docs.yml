name: Documentation and hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/smoke_adoption.py
      - run: python3 scripts/test_hygiene.py
      - run: python3 scripts/check_hygiene.py --tracked
